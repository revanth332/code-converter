options:
  logging: CLOUD_LOGGING_ONLY
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t',
      'asia-south1-docker.pkg.dev/leafy-outrider-472511-q9/code-converter/app:$COMMIT_SHA',
      '.'
    ]

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/leafy-outrider-472511-q9/code-converter/app:$COMMIT_SHA' 
    ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'code-converter',
      '--image', 'asia-south1-docker.pkg.dev/leafy-outrider-472511-q9/code-converter/app:$COMMIT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-secrets', 'GEMINI_API_KEY:GEMINI_API_KEY:latest'
    ]
images:
  - 'asia-south1-docker.pkg.dev/leafy-outrider-472511-q9/code-converter/app:$COMMIT_SHA'
